# Fly.io deployment config for Kairos

# ⚠️ IMPORTANT: This file is for Fly.io ONLY. It does NOT affect:
#   - Local dev (docker-compose up)
#   - GCP (docker-compose -f docker-compose.prod.yml up)
#   - Docker Compose deployments on any other platform
#
# To deploy on Fly.io: flyctl deploy
# To deploy elsewhere: use docker-compose.yml or docker-compose.prod.yml

app = "kairos-znpphq"
primary_region = "cdg"  # Paris, France

[build]
dockerfile = "Dockerfile"
# Build context is the entire repo root
# The Dockerfile copies from backend/ automatically

[env]
# Fly.io managed Postgres and Redis connections are injected via fly secrets
# Add these via: flyctl secrets set POSTGRES_PASSWORD=... etc
POSTGRES_USER = "kairos"
POSTGRES_DB = "kairos"
DATA_DIR = "/data"
FRONTEND_DIR = "/frontend"
MEDIA_INPUT_DIR = "/media_in"
RTVC_BASE_URL = "https://api.rtvc-media.com"
RTVC_VERIFY_SSL = "true"
HLS_POLL_INTERVAL = "5"
HLS_POLL_TIMEOUT = "900"
KAIROS_PASSWORD = "KairosDemo2026"

[processes]
web = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
# Worker d'indexation (OCR + embeddings). Necessite l'app Redis
# `kairos-broker` (voir redis/fly.toml) et les secrets CELERY_BROKER_URL /
# CELERY_RESULT_BACKEND. concurrency=1 : une seule video a la fois, le
# traitement est deja gourmand en CPU/RAM.
worker = "celery -A app.worker.celery_app worker --loglevel=info --concurrency=1"

[[vm]]
# 256 Mo (defaut shared-cpu-1x) est insuffisant : le simple `import torch` +
# sentence-transformers (charges par app/embeddings.py, meme sans transcrire
# l'audio localement) depasse deja ce plafond -> OOM kill en boucle. Meme a
# 1 Go la machine EXISTANTE continuait a etre tuee a ~860 Mo resident (le
# rolling deploy ne redimensionne pas toujours une machine deja provisionnee) :
# passe a 2 Go pour une vraie marge. Forcer aussi le redimensionnement de la
# machine existante : flyctl scale memory 2048 --app kairos-znpphq
size = "shared-cpu-1x"
memory = "2gb"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1
processes = ["web"]

[[http_service.checks]]
grace_period = "30s"
interval = "30s"
timeout = "5s"
method = "GET"
path = "/health"

[[mounts]]
# Persistent storage for media files.
# processes = ["web"] est OBLIGATOIRE depuis l'ajout du groupe "worker" : un
# volume Fly est rattache a UNE machine et ne peut pas etre partage entre
# groupes de process. Sans cette ligne, Fly reclamerait un volume par groupe.
# Consequence assumee : le worker ecrit ses fichiers de travail sur un disque
# ephemere. Ce qu'il produit d'important (transcriptions, OCR, embeddings) va
# en base Postgres, donc partage ; seule la copie de lecture video n'est pas
# visible par le web — la lecture video n'est de toute facon pas disponible
# en prod pour les medias venant de la base externe.
source = "media_storage"
destination = "/data"
processes = ["web"]

# Input media staging (read-only in prod)
# source = "media_input"
# destination = "/media_in"

# NOTES ON KAIROS ARCHITECTURE FOR FLY.IO:
#
# 1. DATABASE: PAS `flyctl postgres create` — l'image postgres-flex de Fly
#    n'embarque PAS pgvector (CREATE EXTENSION vector -> "not available").
#    Deployer db/fly.toml (image pgvector/pgvector:pg16), puis :
#    flyctl secrets set DATABASE_URL="postgresql+psycopg://kairos:<mdp>@kairos-vectordb.internal:5432/kairos" --app kairos-znpphq
#
# 2. REDIS: deployer redis/fly.toml (image redis:7-alpine, reseau prive), puis :
#    flyctl secrets set CELERY_BROKER_URL="redis://kairos-broker.internal:6379/0" \
#                       CELERY_RESULT_BACKEND="redis://kairos-broker.internal:6379/1" --app kairos-znpphq
#
# 3. CELERY WORKER: inclus ici comme groupe de process "worker" (voir
#    [processes] plus haut). Fly lance une machine par groupe. Le volume
#    media_storage reste reserve au groupe "web" (un volume Fly n'est pas
#    partageable) : le worker persiste son travail en base, pas sur disque.
#
# 4. ENVIRONMENT VARIABLES:
#    Secrets (never in this file):
#    flyctl secrets set POSTGRES_PASSWORD=<strong-password>
#    flyctl secrets set RTVC_USERNAME=Rtvc2026
#    flyctl secrets set RTVC_PASSWORD=<actual-password>
#    flyctl secrets set WEBHOOK_SECRET=<random-string>
#
# 5. VOLUME STRATEGY:
#    - media_storage: shared across all instances, persists uploads/transcodes
#    - media_input: optional, for initial seed data (keep read-only in prod)
#
# 6. MACHINE SIZING:
#    shared-cpu-1x: 1 shared CPU, 256 MB RAM (free tier, ~$0/mo if under limits)
#    shared-cpu-2x: 2 shared CPU, 512 MB RAM (~$2/mo)
#    performance-1x: 1 full CPU, 2 GB RAM (~$12/mo)
#    For Kairos with Whisper (CPU-intensive): recommend performance-1x min
#
# 7. COSTS:
#    Free: 3 shared-cpu-1x machines (1 always on, 2 can stop)
#    Prod: ~$12-24/mo for shared-cpu-2x or performance-1x + Postgres + Redis
#
# 8. DIFFERENCES FROM DOCKER-COMPOSE & GCP:
#    - NO hot reload (--reload removed)
#    - NO bind-mounts (volumes are persistent storage, not code)
#    - Database/Redis are managed services (auto-provisioned)
#    - Single process (no docker-compose orchestration)
#    - Health checks via HTTP /health (not container status)
